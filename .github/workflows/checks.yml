name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request stops the run for the push before it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Go tests need the built web app, so build first.
      - name: Build the web app
        run: make web

      - name: Test
        run: make test

      # The installers only run on a Proxmox host, so this is where their
      # mistakes show up before then.
      - name: ShellCheck
        run: make shellcheck

      - name: Formatting
        run: |
          test -z "$(gofmt -l cmd internal dev web/embed.go)" || { gofmt -l cmd internal dev web/embed.go; exit 1; }
          cd web && npx prettier --check "**/*.{ts,tsx}"
