name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Go tests need the built web app, so build first.
      - name: Build the bundle
        run: make bundle VERSION="$GITHUB_REF_NAME" REPO="$GITHUB_REPOSITORY"

      - name: Test
        run: make test

      - name: Sign the bundle
        env:
          IGLO_SIGNING_KEY: ${{ secrets.IGLO_SIGNING_KEY }}
        run: go run ./cmd/iglo-release sign -version "$GITHUB_REF_NAME" "dist/iglo-$GITHUB_REF_NAME-linux-amd64.tar.gz"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "dist/iglo-$GITHUB_REF_NAME-linux-amd64.tar.gz" \
            "dist/iglo-$GITHUB_REF_NAME-linux-amd64.tar.gz.sig"
