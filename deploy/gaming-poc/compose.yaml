# Experimental privileged-LXC layout from the Wolf Proxmox quickstart.
name: iglo-gaming-poc
services:
  wolf:
    image: ghcr.io/games-on-whales/wolf:stable@sha256:b0ef253739f9bd49b71eba7e150c955fd05990c0d409e666d89236995351551a
    restart: unless-stopped
    network_mode: host
    environment:
      WOLF_RENDER_NODE: /dev/dri/renderD128
      WOLF_SOCKET_PATH: /var/run/wolf/wolf.sock
    volumes:
      - /etc/wolf:/etc/wolf
      - /var/run/wolf:/var/run/wolf
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/dev:/dev
      - /mnt/udev:/run/udev
    devices:
      - /dev/dri
      - /dev/uinput
      - /dev/uhid
    device_cgroup_rules:
      - 'c 13:* rmw'
    mem_limit: 768m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
