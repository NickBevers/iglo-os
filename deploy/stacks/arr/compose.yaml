# Media automation stack. Values come from .env next to this file,
# which the installer writes.
#
# Behind the VPN (share gluetun's network): qbittorrent, prowlarr, flaresolverr.
# Other containers reach them at gluetun:<port>.
name: arr

x-servarr-env: &servarr-env
  PUID: 1000
  PGID: 1000
  TZ: ${TZ}

services:
  gluetun:
    # Pinned: the VPN locations of Iglo-OS and the settings below are checked
    # against this version. dev/vpnlocations makes the list for a new one.
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027 # v3.41.3, pinned 2026-10-28
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      # iglo-arr vpn writes these in .env for ProtonVPN or PIA. A stack from
      # before the provider choice has only WIREGUARD_PRIVATE_KEY and
      # VPN_COUNTRIES, and the defaults keep it on ProtonVPN. Gluetun treats an
      # empty value as not set (v3.41.3).
      VPN_SERVICE_PROVIDER: ${GLUETUN_PROVIDER:-protonvpn}
      VPN_TYPE: ${GLUETUN_VPN_TYPE:-wireguard}
      # The logins and keys are secret files in /run/secrets, which Gluetun
      # prefers (see volumes). Only a stack from before them has this one.
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      OPENVPN_CUSTOM_CONFIG: ${GLUETUN_OPENVPN_CONFIG:-}
      SERVER_COUNTRIES: ${VPN_COUNTRIES:-}
      SERVER_REGIONS: ${VPN_REGIONS:-}
      SERVER_NAMES: ${GLUETUN_SERVER_NAMES:-}
      PORT_FORWARD_ONLY: ${GLUETUN_PORT_FORWARD_ONLY:-on}
      VPN_PORT_FORWARDING: "on"
      # A PIA dedicated IP uses Gluetun's custom provider with PIA's port
      # forwarding, which logs in with the normal PIA account.
      VPN_PORT_FORWARDING_PROVIDER: ${GLUETUN_PORT_FORWARDING_PROVIDER:-}
      # The kill switch is Gluetun's firewall, which blocks all traffic outside
      # the tunnel. When the VPN drops, qBittorrent is also bound to lo until it is back.
      # Tell qBittorrent which port the VPN forwarded (from the Gluetun wiki).
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      VPN_PORT_FORWARDING_DOWN_COMMAND: >-
        /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
    ports:
      - 8080:8080 # qBittorrent
      - 9696:9696 # Prowlarr
    volumes:
      - ./config/gluetun:/gluetun
      # The VPN secrets, sealed on the host and unsealed there into RAM at
      # the start of the container (deploy/secrets.sh). Never on its disk.
      - /mnt/iglo-secrets:/run/secrets:ro
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f # 5.3.0_v2.1.2-ls485, pinned 2026-10-28
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *servarr-env
      WEBUI_PORT: 8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_DIR:-/data}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104 # 2.7.0.5723-ls166, pinned 2026-10-28
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *servarr-env
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY}
      PROWLARR__AUTH__METHOD: Forms
      PROWLARR__AUTH__REQUIRED: Enabled
    volumes:
      - ./config/prowlarr:/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767 # v3.5.2, pinned 2026-10-28
    container_name: flaresolverr
    # Only runs when COMPOSE_PROFILES in .env has flaresolverr.
    profiles: [flaresolverr]
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: ${TZ}
    # FlareSolverr runs a browser for every challenge, and a stuck one can grow
    # until it takes the memory of the whole stack.
    mem_limit: 1g
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:084b3b2ab1d0ef930660727259546a241f2bdf67c9ed085d54bf1486a6887c9b # 6.4.4.10685-ls324, pinned 2026-10-28
    container_name: radarr
    environment:
      <<: *servarr-env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY}
      RADARR__AUTH__METHOD: Forms
      RADARR__AUTH__REQUIRED: Enabled
    ports:
      - 7878:7878
    volumes:
      - ./config/radarr:/config
      - ${DATA_DIR:-/data}:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:48e36b608b461273b9dae857725cd0561a127f2c694b687318f6d0c5ce63e5c9 # 4.0.20.3014-ls1, pinned 2026-10-28
    container_name: sonarr
    environment:
      <<: *servarr-env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY}
      SONARR__AUTH__METHOD: Forms
      SONARR__AUTH__REQUIRED: Enabled
    ports:
      - 8989:8989
    volumes:
      - ./config/sonarr:/config
      - ${DATA_DIR:-/data}:/data
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:9a625883f054e722795affe5e3ca71057e6ed817ecdf99f4a99624346fcc509c # v1.6.2-ls370, pinned 2026-10-28
    container_name: bazarr
    environment:
      <<: *servarr-env
    ports:
      - 6767:6767
    volumes:
      - ./config/bazarr:/config
      - ${DATA_DIR:-/data}/media:/data/media
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be # v3.5.1, pinned 2026-10-28
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ}
    ports:
      - 5055:5055
    volumes:
      - ./config/seerr:/app/config
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209 # 8.8.0, pinned 2026-10-28
    container_name: recyclarr
    user: 1000:1000
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: "@daily"
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config
    restart: unless-stopped
