name: iglo-inbox
services:
  fileflows:
    image: revenz/fileflows:stable@sha256:1257d17cca6b2d4ca2ad2cb7ffcbffcd22f66741151a9f5e40b46f2b73efa316
    restart: unless-stopped
    ports:
      - '19200:5000'
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: '${TZ:-UTC}'
    cpus: 2
    mem_limit: 1536m
    pids_limit: 256
    volumes:
      - /var/lib/iglo-inbox/data:/app/Data
      - /var/lib/iglo-inbox/logs:/app/Logs
      - /var/lib/iglo-inbox/common:/app/common
      - /var/lib/iglo-inbox/temp:/temp
      - /var/lib/iglo-inbox/admission:/gate:ro
      - /data/inbox:/media/inbox:ro
      - /data/videos/home-videos:/media/output
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
