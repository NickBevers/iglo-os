# The upstream v3.3.5 compose file is vendored unchanged as compose.yaml.
# Derivatives and model downloads stay on SSD; managed originals stay on SMB.
services:
  immich-server:
    volumes:
      - /var/lib/immich/thumbs:/data/thumbs
      - /var/lib/immich/encoded-video:/data/encoded-video
    cpus: 2
    mem_limit: 3g
    environment:
      # Machine learning is off: no faces, smart search or duplicate
      # detection. The default of machineLearning.enabled reads this variable,
      # and Immich saves only settings that differ from the defaults
      # (server/src/dtos/config.dto.ts and utils/config.ts at v3.3.5, checked
      # 19 November 2026).
      IMMICH_MACHINE_LEARNING_ENABLED: "false"
  immich-machine-learning:
    # compose.yaml stays the vendored upstream file. A profile nobody turns
    # on keeps this service from starting.
    profiles: [machine-learning]
  database:
    cpus: 1
    mem_limit: 1536m
  redis:
    cpus: 0.5
    mem_limit: 256m
