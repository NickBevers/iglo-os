# The upstream v3.3.5 compose file is vendored unchanged as compose.yaml.
# Derivatives and model downloads stay on SSD; managed originals stay on SMB.
services:
  immich-server:
    volumes:
      - /var/lib/immich/thumbs:/data/thumbs
      - /var/lib/immich/encoded-video:/data/encoded-video
    cpus: 2
    mem_limit: 3g
  immich-machine-learning:
    volumes:
      - /var/lib/immich/model-cache:/cache
    cpus: 2
    # OpenVINO needs more room than the CPU models while it compiles them.
    mem_limit: 2560m
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
      MACHINE_LEARNING_WORKERS: 1
      # Immich v3.3.5 config.py, checked 28 October 2026. Docker CPU quotas
      # do not limit os.cpu_count(), so bound request and CPU inference pools.
      MACHINE_LEARNING_REQUEST_THREADS: 2
      MACHINE_LEARNING_MODEL_INTER_OP_THREADS: 1
      MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: 2
  database:
    cpus: 1
    mem_limit: 1536m
  redis:
    cpus: 0.5
    mem_limit: 256m
